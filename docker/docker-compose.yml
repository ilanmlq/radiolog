  frontend:
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_PUBLIC_API_BASE_URL: "http://localhost:3000/api"
      VITE_APP_ENV: "development"
    ports:
      - "3001:3001"
    build:
      context: ../
      dockerfile: frontend/Dockerfile
    develop:
      watch:
        - action: sync
          path: ../frontend
          target: /app
          ignore:
            - ../frontend/node_modules
        - action: rebuild
          path: ../frontend/package.json
          target: /app

  backend:
#    depends_on:
#      mongodb:
#        condition: service_started
    env_file: ../backend/.env
    ports:
      - "3000:3000"
    build:
      context: ../
      dockerfile: backend/Dockerfile
    develop:
      watch:
        - action: sync
          path: ../backend
          target: /app
          ignore:
            - ../backend/node_modules
        - action: rebuild
          path: ../backend/package.json
          target: /app

volumes:
  mongodb_data: